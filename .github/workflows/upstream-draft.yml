name: Publish signed Quiet UI for upstream release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream v2rayN tag (for example 7.24.4)
        required: false
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  detect-build-release:
    runs-on: windows-latest
    steps:
      - name: Check out customized branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve upstream tag and build patch layer
        id: prepare
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          BASE_TAG: ${{ vars.QUIET_UI_BASE_TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git remote add upstream https://github.com/2dust/v2rayN.git 2>$null
          git fetch upstream --tags --force
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed: $LASTEXITCODE" }
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'Quiet-Control-Center-CI' } https://api.github.com/repos/2dust/v2rayN/releases/latest
            $tag = $release.tag_name
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $releaseTag = "quiet-$tag"
          if (gh release view $releaseTag --repo "${{ github.repository }}" 2>$null) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Quiet release $releaseTag already exists; nothing to publish."
            exit 0
          }
          "skip=false" >> $env:GITHUB_OUTPUT
          $base = if ($env:BASE_TAG) { $env:BASE_TAG } else { '7.24.3' }
          git rev-parse "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Missing upstream tag: $tag" }
          git rev-parse "refs/tags/$base" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Missing Quiet UI base tag: $base" }
          $patch = Join-Path $env:RUNNER_TEMP quiet-ui.patch
          git diff --binary "--output=$patch" "refs/tags/$base" HEAD -- .github/workflows/upstream-draft.yml v2rayN/v2rayN/Views v2rayN/v2rayN/Resources v2rayN/v2rayN/Services v2rayN/v2rayN/v2rayN.csproj v2rayN/AmazTool v2rayN/v2rayN.Tests v2rayN/v2rayN.slnx .gitignore .gitmodules BUILDING.md design-qa.md tools
          if ($LASTEXITCODE -ne 0) { throw "Quiet UI patch generation failed: $LASTEXITCODE" }
          if ((Get-Item $patch).Length -eq 0) { throw 'Quiet UI patch layer is empty.' }
          "patch=$patch" >> $env:GITHUB_OUTPUT

      - name: Reapply Quiet UI onto exact upstream tag
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git checkout --detach "refs/tags/${{ steps.prepare.outputs.tag }}"
          git submodule update --init --recursive
          git apply --check "${{ steps.prepare.outputs.patch }}"
          git apply "${{ steps.prepare.outputs.patch }}"

      - name: Setup .NET 10
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, test, and publish
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore v2rayN/v2rayN.slnx
          dotnet build v2rayN/v2rayN/v2rayN.csproj -c Release --no-restore
          dotnet test v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore --logger trx
          dotnet test v2rayN/v2rayN.Tests/v2rayN.Tests.csproj -c Release --no-restore --logger trx
          dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 --self-contained true -o artifacts/qcc-win-x64
          dotnet publish v2rayN/AmazTool/AmazTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/qcc-helper
          Copy-Item artifacts/qcc-helper/AmazTool.exe artifacts/qcc-win-x64/AmazTool.exe -Force

      - name: Package and generate manifest
        if: steps.prepare.outputs.skip != 'true'
        id: package
        shell: pwsh
        env:
          QCC_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.QCC_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.prepare.outputs.tag }}'
          $version = $tag.TrimStart('v','V')
          if ([string]::IsNullOrWhiteSpace($env:QCC_SIGNING_PRIVATE_KEY_PEM)) {
            throw 'QCC_SIGNING_PRIVATE_KEY_PEM is required; unsigned releases are forbidden.'
          }
          & ./tools/package-qcc.ps1 -Artifact artifacts/qcc-win-x64 -Helper artifacts/qcc-helper/AmazTool.exe -Version $version
          $zip = "QuietControlCenter-$tag-win-x64.zip"
          Compress-Archive artifacts/qcc-win-x64/* $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            product = 'QuietControlCenter'
            appVersion = $tag.TrimStart('v','V')
            platform = 'win-x64'
            assetUrl = "https://github.com/${{ github.repository }}/releases/download/quiet-$tag/$zip"
            sha256 = $sha
            signature = $null
            provenanceUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          $canonical = "1`nQuietControlCenter`n$($manifest.appVersion)`nwin-x64`n$($manifest.assetUrl)`n$sha`n$($manifest.provenanceUrl)`n"
          $key = [Security.Cryptography.ECDsa]::Create()
          $key.ImportFromPem($env:QCC_SIGNING_PRIVATE_KEY_PEM)
          $sig = $key.SignData([Text.Encoding]::UTF8.GetBytes($canonical), [Security.Cryptography.HashAlgorithmName]::SHA256)
          $manifest.signature = [Convert]::ToBase64String($sig)
          $key.Dispose()
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 quiet-update-manifest.json
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish signed custom release
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseTag = "quiet-${{ steps.prepare.outputs.tag }}"
          if (gh release view $releaseTag 2>$null) {
            gh release upload $releaseTag "${{ steps.package.outputs.zip }}" quiet-update-manifest.json --clobber
            gh release edit $releaseTag --draft=false --latest --title "Quiet Control Center ${{ steps.prepare.outputs.tag }}" --notes "Automatically rebuilt from upstream ${{ steps.prepare.outputs.tag }}. All build, ServiceLib, update-security, marker and signing gates passed."
          } else {
            gh release create $releaseTag "${{ steps.package.outputs.zip }}" quiet-update-manifest.json --latest --title "Quiet Control Center ${{ steps.prepare.outputs.tag }}" --notes "Automatically rebuilt from upstream ${{ steps.prepare.outputs.tag }}. All build, ServiceLib, update-security, marker and signing gates passed."
          }
