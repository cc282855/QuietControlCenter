name: Publish signed Quiet UI for upstream release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream v2rayN tag (for example 7.24.4)
        required: false
      release_version:
        description: Optional Quiet hotfix version (for example 7.24.4.1)
        required: false
      force_rebuild:
        description: Rebuild and repair an existing Quiet release
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  detect-build-release:
    runs-on: windows-latest
    steps:
      - name: Check out customized branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve upstream tag and build patch layer
        id: prepare
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          BASE_TAG: ${{ vars.QUIET_UI_BASE_TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git remote add upstream https://github.com/2dust/v2rayN.git 2>$null
          git fetch upstream --tags --force
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed: $LASTEXITCODE" }
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $releases = Invoke-RestMethod -Headers @{ 'User-Agent' = 'Quiet-Control-Center-CI' } 'https://api.github.com/repos/2dust/v2rayN/releases?per_page=100'
            $candidates = @($releases | Where-Object { -not $_.draft } | ForEach-Object {
              if ($_.tag_name -match '^v?(?<version>\d+\.\d+\.\d+)(?:[-+].*)?$') {
                [pscustomobject]@{
                  Tag = $_.tag_name
                  Version = [Version]$Matches.version
                  PublishedAt = [DateTimeOffset]$_.published_at
                }
              }
            })
            if ($candidates.Count -eq 0) { throw 'No semantic upstream release was found.' }
            $tag = ($candidates | Sort-Object Version, PublishedAt -Descending | Select-Object -First 1).Tag
          }
          if ($tag -notmatch '^v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid upstream tag: $tag" }
          $version = if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) { $tag.TrimStart('v','V') } else { $env:RELEASE_VERSION.Trim() }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') { throw "Invalid Quiet release version: $version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          $releaseTag = "quiet-$version"
          $zipName = "QuietControlCenter-$version-win-x64.zip"
          $PSNativeCommandUseErrorActionPreference = $false
          $releaseJson = gh release view $releaseTag --repo "${{ github.repository }}" --json isDraft,assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($releaseExists -and $env:FORCE_REBUILD -ne 'true') {
            $quietRelease = $releaseJson | ConvertFrom-Json
            $expectedAssets = @($zipName, 'quiet-update-manifest.json')
            $assets = @($quietRelease.assets)
            $assetNames = @($assets | ForEach-Object name)
            $complete = -not $quietRelease.isDraft -and $assets.Count -eq 2 -and
              @($expectedAssets | Where-Object { $_ -notin $assetNames }).Count -eq 0 -and
              @($assets | Where-Object { $_.state -ne 'uploaded' -or $_.digest -notmatch '^sha256:[0-9a-f]{64}$' }).Count -eq 0
            if ($complete) {
              "skip=true" >> $env:GITHUB_OUTPUT
              Write-Host "Complete Quiet release $releaseTag already exists; nothing to publish."
              exit 0
            }
            Write-Host "Quiet release $releaseTag is incomplete or still a draft; rebuilding it."
          }
          "skip=false" >> $env:GITHUB_OUTPUT
          $base = if ($env:BASE_TAG) { $env:BASE_TAG } else { '7.24.3' }
          git rev-parse "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Missing upstream tag: $tag" }
          git rev-parse "refs/tags/$base" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Missing Quiet UI base tag: $base" }
          $patch = Join-Path $env:RUNNER_TEMP quiet-ui.patch
          git diff --binary "--output=$patch" "refs/tags/$base" HEAD -- .github/workflows/upstream-draft.yml v2rayN/ServiceLib v2rayN/ServiceLib.Tests v2rayN/v2rayN/App.xaml v2rayN/v2rayN/App.xaml.cs v2rayN/v2rayN/Views v2rayN/v2rayN/Resources v2rayN/v2rayN/Services v2rayN/v2rayN/v2rayN.csproj v2rayN/AmazTool v2rayN/v2rayN.Tests v2rayN/v2rayN.slnx .gitignore .gitmodules BUILDING.md design-qa.md tools
          if ($LASTEXITCODE -ne 0) { throw "Quiet UI patch generation failed: $LASTEXITCODE" }
          if ((Get-Item $patch).Length -eq 0) { throw 'Quiet UI patch layer is empty.' }
          "patch=$patch" >> $env:GITHUB_OUTPUT

      - name: Reapply Quiet UI onto exact upstream tag
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git checkout --detach "refs/tags/${{ steps.prepare.outputs.tag }}"
          git submodule update --init --recursive
          git apply --3way --check "${{ steps.prepare.outputs.patch }}"
          git apply --3way "${{ steps.prepare.outputs.patch }}"

      - name: Guard customized main window source
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$xaml = Get-Content -LiteralPath v2rayN/v2rayN/Views/MainWindow.xaml -Raw -Encoding utf8
          $namespaces = [Xml.XmlNamespaceManager]::new($xaml.NameTable)
          $namespaces.AddNamespace('base', 'clr-namespace:v2rayN.Base')
          $namespaces.AddNamespace('p', 'http://schemas.microsoft.com/winfx/2006/xaml/presentation')
          $root = $xaml.DocumentElement
          if ($root.GetAttribute('Title') -ne '玄同' -or
              $root.GetAttribute('Style') -ne '{StaticResource QccWindow}') {
            throw 'Customized main window guard failed; title or QccWindow style is missing.'
          }
          $popupSource = 'pack://application:,,,/MaterialDesignThemes.Wpf;component/Themes/MaterialDesignTheme.Popupbox.xaml'
          $popupDictionaries = @($xaml.SelectNodes(
            "/base:WindowBase/p:Window.Resources/p:ResourceDictionary/p:ResourceDictionary.MergedDictionaries/p:ResourceDictionary[@Source='$popupSource']",
            $namespaces
          ))
          if ($popupDictionaries.Count -ne 1) {
            throw "Customized main window guard failed; expected exactly one PopupBox resource dictionary, found $($popupDictionaries.Count)."
          }
          [xml]$appXaml = Get-Content -LiteralPath v2rayN/v2rayN/App.xaml -Raw -Encoding utf8
          $appNamespaces = [Xml.XmlNamespaceManager]::new($appXaml.NameTable)
          $appNamespaces.AddNamespace('p', 'http://schemas.microsoft.com/winfx/2006/xaml/presentation')
          $quietThemeDictionaries = @($appXaml.SelectNodes(
            "/p:Application/p:Application.Resources/p:ResourceDictionary/p:ResourceDictionary.MergedDictionaries/p:ResourceDictionary[@Source='Resources/QuietControlTheme.xaml']",
            $appNamespaces
          ))
          if ($quietThemeDictionaries.Count -ne 1) {
            throw "Customized application guard failed; expected exactly one QuietControlTheme dictionary, found $($quietThemeDictionaries.Count)."
          }

      - name: Setup .NET 10
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, test, and publish
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ steps.prepare.outputs.version }}'
          dotnet restore v2rayN/v2rayN.slnx
          dotnet build v2rayN/v2rayN/v2rayN.csproj -c Release --no-restore -p:Version=$version
          dotnet test v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore --logger trx
          dotnet test v2rayN/v2rayN.Tests/v2rayN.Tests.csproj -c Release --no-restore --logger trx
          dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -o artifacts/qcc-win-x64
          dotnet publish v2rayN/AmazTool/AmazTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o artifacts/qcc-helper
          Copy-Item artifacts/qcc-helper/AmazTool.exe artifacts/qcc-win-x64/AmazTool.exe -Force

      - name: Import verified upstream runtime payload
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = '${{ steps.prepare.outputs.tag }}'
          $assetName = 'v2rayN-windows-64.zip'
          $release = gh api "repos/2dust/v2rayN/releases/tags/$tag" | ConvertFrom-Json
          $asset = @($release.assets | Where-Object name -eq $assetName)
          if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Verified upstream asset is unavailable: $assetName"
          }
          New-Item -ItemType Directory -Path artifacts/upstream -Force | Out-Null
          gh release download $tag --repo 2dust/v2rayN --pattern $assetName --dir artifacts/upstream
          $archive = Join-Path artifacts/upstream $assetName
          $actualDigest = 'sha256:' + (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -ne $asset[0].digest.ToLowerInvariant()) { throw 'Upstream runtime archive digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath artifacts/upstream-expanded -Force
          $binCandidates = @(Get-ChildItem -LiteralPath artifacts/upstream-expanded -Directory -Recurse | Where-Object Name -eq 'bin')
          if ($binCandidates.Count -ne 1) { throw "Expected exactly one upstream bin directory; found $($binCandidates.Count)." }
          Copy-Item -LiteralPath $binCandidates[0].FullName -Destination artifacts/qcc-win-x64 -Recurse -Force
          if (-not (Test-Path artifacts/qcc-win-x64/bin/xray/xray.exe) -or
              -not (Test-Path artifacts/qcc-win-x64/bin/sing_box/sing-box.exe) -or
              -not (Test-Path artifacts/qcc-win-x64/bin/mihomo/mihomo.exe)) {
            throw 'Required proxy cores are absent from the verified upstream runtime payload.'
          }

      - name: Package final ZIP
        if: steps.prepare.outputs.skip != 'true'
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.prepare.outputs.version }}'
          & ./tools/package-qcc.ps1 -Artifact artifacts/qcc-win-x64 -Helper artifacts/qcc-helper/AmazTool.exe -Version $version
          $zip = "QuietControlCenter-$version-win-x64.zip"
          Compress-Archive artifacts/qcc-win-x64/* $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Smoke test final ZIP startup
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = '${{ steps.package.outputs.zip }}'
          $smokeRoot = Join-Path $env:RUNNER_TEMP "qcc-final-zip-smoke-$([Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $smokeRoot -Force
          $exe = Join-Path $smokeRoot '玄同.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Final ZIP does not contain 玄同.exe at its root: $zip"
          }
          $process = $null
          $startedAt = [DateTime]::UtcNow
          try {
            $process = Start-Process -FilePath $exe -WorkingDirectory $smokeRoot -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "Final ZIP startup smoke test process exited early with code $($process.ExitCode)."
              }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero -and $process.MainWindowTitle.StartsWith('玄同')) {
                break
              }
            } while ([DateTime]::UtcNow -lt $deadline)

            Start-Sleep -Seconds 2
            $logFiles = @(Get-ChildItem -LiteralPath (Join-Path $smokeRoot 'guiLogs') -Filter '*.txt' -File -Recurse -ErrorAction SilentlyContinue)
            foreach ($logFile in $logFiles) {
              Write-Host "----- smoke log: $($logFile.FullName) -----"
              Get-Content -LiteralPath $logFile.FullName -ErrorAction SilentlyContinue | Write-Host
            }
            $logFailures = @($logFiles |
              Where-Object LastWriteTimeUtc -ge $startedAt |
              Select-String -Pattern 'App_DispatcherUnhandledException|XamlParseException|StaticResourceExtension')
            if ($logFailures.Count -gt 0) {
              throw "Final ZIP startup log contains a fatal UI/XAML error: $($logFailures[0].Line)"
            }

            $process.Refresh()
            if ($process.HasExited) { throw 'Final ZIP startup smoke test process did not remain alive.' }
            if ($process.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Final ZIP did not create a main window within 30 seconds.' }
            if (-not $process.MainWindowTitle.StartsWith('玄同')) {
              throw "Unexpected final ZIP main window title: '$($process.MainWindowTitle)'"
            }
            Write-Host "Final ZIP startup smoke test passed for PID $($process.Id)."
          }
          finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
          }

      - name: Capture isolated visual QA frames
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = '${{ steps.package.outputs.zip }}'
          $qaRoot = Join-Path $env:RUNNER_TEMP "qcc-visual-qa-$([Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $qaRoot -Force | Out-Null
          New-Item -ItemType Directory -Path artifacts/visual-qa -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $qaRoot -Force
          $exe = Join-Path $qaRoot '玄同.exe'
          $captures = @(
            @{ Name = 'qcc-1120x720-good.png'; Width = 1120; Height = 720; Delay = 78; Jitter = 12; Loss = 0 },
            @{ Name = 'qcc-1120x720-warning.png'; Width = 1120; Height = 720; Delay = 145; Jitter = 35; Loss = 2 },
            @{ Name = 'qcc-1487x1058-danger.png'; Width = 1487; Height = 1058; Delay = 260; Jitter = 70; Loss = 8 }
          )
          foreach ($capture in $captures) {
            $output = (Resolve-Path artifacts/visual-qa).Path + '\' + $capture.Name
            $arguments = @(
              '--qcc-qa-capture', $output, $capture.Width, $capture.Height,
              '--qcc-qa-quality-sample', $capture.Delay, $capture.Jitter, $capture.Loss
            )
            $process = Start-Process -FilePath $exe -WorkingDirectory $qaRoot -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Visual QA capture timed out: $($capture.Name)"
            }
            Write-Host "Visual QA exit code: $($process.ExitCode)"
            if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
              $errorReport = "$output.error.txt"
              if (Test-Path -LiteralPath $errorReport -PathType Leaf) {
                Get-Content -LiteralPath $errorReport | Write-Host
              }
              $guiLogs = Join-Path $qaRoot 'guiLogs'
              if (Test-Path -LiteralPath $guiLogs -PathType Container) {
                Get-ChildItem -LiteralPath $guiLogs -Filter '*.txt' -File -Recurse |
                  ForEach-Object { Write-Host "----- $($_.FullName) -----"; Get-Content -LiteralPath $_.FullName | Write-Host }
              }
              throw "Visual QA capture failed: $($capture.Name)"
            }
          }

      - name: Upload visual QA frames
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-${{ steps.prepare.outputs.version }}
          path: artifacts/visual-qa/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Sign verified update manifest
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        env:
          QCC_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.QCC_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.prepare.outputs.version }}'
          $zip = '${{ steps.package.outputs.zip }}'
          $sha = '${{ steps.package.outputs.sha }}'
          if ([string]::IsNullOrWhiteSpace($env:QCC_SIGNING_PRIVATE_KEY_PEM)) {
            throw 'QCC_SIGNING_PRIVATE_KEY_PEM is required; unsigned releases are forbidden.'
          }
          $manifest = [ordered]@{
            schema = 1
            product = 'QuietControlCenter'
            appVersion = $tag.TrimStart('v','V')
            platform = 'win-x64'
            assetUrl = "https://github.com/${{ github.repository }}/releases/download/quiet-$tag/$zip"
            sha256 = $sha
            signature = $null
            provenanceUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          $canonical = "1`nQuietControlCenter`n$($manifest.appVersion)`nwin-x64`n$($manifest.assetUrl)`n$sha`n$($manifest.provenanceUrl)`n"
          $signingKey = $env:QCC_SIGNING_PRIVATE_KEY_PEM.Trim()
          if ($signingKey -notmatch '^-----BEGIN ') {
            try {
              $signingKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($signingKey))
            }
            catch {
              throw 'QCC_SIGNING_PRIVATE_KEY_PEM is neither PEM nor base64-encoded PEM.'
            }
          }
          $signingKey = $signingKey.Replace('\r\n', "`n").Replace('\n', "`n")
          $key = [Security.Cryptography.ECDsa]::Create()
          $key.ImportFromPem($signingKey)
          $sig = $key.SignData([Text.Encoding]::UTF8.GetBytes($canonical), [Security.Cryptography.HashAlgorithmName]::SHA256)
          $manifest.signature = [Convert]::ToBase64String($sig)
          $key.Dispose()
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 quiet-update-manifest.json

      - name: Publish signed custom release
        if: steps.prepare.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseTag = "quiet-${{ steps.prepare.outputs.version }}"
          $zip = "${{ steps.package.outputs.zip }}"
          $repository = "${{ github.repository }}"
          $version = "${{ steps.prepare.outputs.version }}"
          $upstreamTag = "${{ steps.prepare.outputs.tag }}"
          $title = "玄同 $version"
          $notes = @"
          ## 玄同 $version

          本版本基于官方 v2rayN $upstreamTag 构建，并保留玄同定制界面与自动更新能力。

          ### 发布校验

          - Windows x64 正式完整包构建通过
          - ServiceLib 与界面自动化测试通过
          - 官方运行时与代理核心完整性校验通过
          - 产品标记及逐文件 SHA-256 校验通过
          - P-256 更新清单签名校验通过

          官方 GUI 版本只用于检测更新，不会直接覆盖玄同定制界面。软件自动安装仅接受本仓库发布并通过签名验证的完整包。
          "@
          $expectedAssets = @($zip, 'quiet-update-manifest.json')
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $releaseTag --repo $repository *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($releaseExists) {
            gh release edit $releaseTag --draft --title $title --notes $notes --repo $repository
          } else {
            gh release create $releaseTag --draft --title $title --notes $notes --repo $repository
          }
          $existing = gh release view $releaseTag --repo $repository --json assets | ConvertFrom-Json
          foreach ($asset in @($existing.assets)) {
            if ($asset.name -notin $expectedAssets) {
              gh release delete-asset $releaseTag $asset.name --yes --repo $repository
            }
          }
          gh release upload $releaseTag $zip quiet-update-manifest.json --clobber --repo $repository
          $draft = gh release view $releaseTag --repo $repository --json isDraft,assets | ConvertFrom-Json
          if (-not $draft.isDraft) { throw 'Release escaped draft state before verification.' }
          $assets = @($draft.assets)
          if ($assets.Count -ne 2) { throw "Expected exactly two release assets; found $($assets.Count)." }
          foreach ($path in $expectedAssets) {
            $asset = @($assets | Where-Object name -eq $path)
            $expectedDigest = 'sha256:' + (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].digest.ToLowerInvariant() -ne $expectedDigest) {
              throw "Release asset verification failed: $path"
            }
          }
          gh release edit $releaseTag --draft=false --latest --title $title --notes $notes --repo $repository
          $published = gh release view $releaseTag --repo $repository --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($published.isDraft -or $published.isPrerelease -or @($published.assets).Count -ne 2) {
            throw 'Release publication verification failed.'
          }
